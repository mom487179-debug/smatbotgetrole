<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GANG ROSTER - REALTIME MANAGEMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 1. ดึงสคริปต์ Firebase (App & Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary-gold: #dfa751;
            --gold-shine: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --bg-dark: #0a0a0c; 
            --card-bg: rgba(18, 18, 24, 0.75);
            --card-border: rgba(223, 167, 81, 0.3);
            --text-light: #f1f1f1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, rgba(223, 167, 81, 0.1) 0%, transparent 70%);
            background-size: cover; background-position: center; background-attachment: fixed;
            color: var(--text-light); min-height: 100vh; padding-bottom: 50px;
        }

        header {
            background: rgba(10, 10, 12, 0.85); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border); padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }

        .gang-brand { display: flex; align-items: center; gap: 15px; }
        .gang-logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-gold); }
        .gang-title { font-size: 1.8rem; font-weight: 700; background: var(--gold-shine); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .btn-admin {
            background: transparent; color: var(--primary-gold); border: 1px solid var(--primary-gold);
            padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: 600;
        }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .section-title { font-size: 1.5rem; margin: 30px 0 15px; color: var(--primary-gold); border-bottom: 2px solid var(--card-border); padding-bottom: 8px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }

        .member-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 15px; padding: 20px; text-align: center; position: relative;
        }
        .avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; }
        
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content { background: #15151c; border: 1px solid var(--primary-gold); width: 90%; max-width: 450px; border-radius: 15px; padding: 25px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; color: var(--primary-gold); font-size: 0.9rem; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; background: #0a0a0c; border: 1px solid #333; color: #fff; border-radius: 6px; }
        .btn-submit { width: 100%; padding: 10px; background: var(--gold-shine); border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="gang-brand">
            <img id="display-logo" class="gang-logo" src="https://via.placeholder.com/150/000000/dfa751?text=GANG" alt="Logo">
            <h1 id="display-name" class="gang-title">THE ROYAL GANG</h1>
        </div>
        <button class="btn-admin" onclick="openLoginModal()"><i class="fa-solid fa-lock"></i> ADMIN</button>
    </header>

    <div class="container">
        <div class="section-title"><i class="fa-solid fa-crown"></i> GANG OWNER</div>
        <div class="grid-container" id="owner-grid"></div>

        <div class="section-title"><i class="fa-solid fa-shield-halved"></i> GANG LEADER</div>
        <div class="grid-container" id="leader-grid"></div>

        <div class="section-title"><i class="fa-solid fa-users"></i> GANG MEMBER</div>
        <div class="grid-container" id="member-grid"></div>
    </div>

    <!-- Modal เข้าสู่ระบบ -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h3 style="color: var(--primary-gold); margin-bottom: 15px;">เข้าสู่ระบบ ADMIN</h3>
            <div class="form-group">
                <input type="password" id="adminPassword" placeholder="รหัสผ่าน (5720)">
            </div>
            <button class="btn-submit" onclick="handleLogin()">LOGIN</button>
            <button onclick="closeModal('loginModal')" style="width: 100%; background: none; border: none; color: #aaa; margin-top: 10px; cursor: pointer;">ยกเลิก</button>
        </div>
    </div>

    <!-- Modal แผงควบคุม Admin -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h3 style="color: var(--primary-gold); margin-bottom: 15px;">จัดการสมาชิก (Realtime)</h3>
            <form onsubmit="saveMemberRealtime(event)">
                <div class="form-group">
                    <label>ชื่อสมาชิก</label>
                    <input type="text" id="m-name" required>
                </div>
                <div class="form-group">
                    <label>ฉายา</label>
                    <input type="text" id="m-alias">
                </div>
                <div class="form-group">
                    <label>ระดับตำแหน่ง</label>
                    <select id="m-role">
                        <option value="owner">Owner</option>
                        <option value="leader">Leader</option>
                        <option value="member" selected>Member</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>URL รูปภาพ</label>
                    <input type="url" id="m-img">
                </div>
                <button type="submit" class="btn-submit">เพิ่มสมาชิกขึ้นระบบ Realtime</button>
            </form>
            <button onclick="closeModal('adminModal')" style="width: 100%; background: none; border: none; color: #aaa; margin-top: 10px; cursor: pointer;">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script>
        // 2. ตั้งค่าการเชื่อมต่อ Firebase ของคุณตรงนี้
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // เริ่มต้นการทำงานของ Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isAdminLoggedIn = false;

        // 3. ระบบซิงค์ข้อมูล Realtime: หากมีเครื่องไหนเพิ่ม/ลบ ข้อมูลจะเปลี่ยนบนทุกหน้าจอทันที!
        db.ref('gangMembers').on('value', (snapshot) => {
            const data = snapshot.val();
            const members = data ? Object.values(data) : [];
            renderMembers(members);
        });

        function renderMembers(members) {
            const ownerGrid = document.getElementById('owner-grid');
            const leaderGrid = document.getElementById('leader-grid');
            const memberGrid = document.getElementById('member-grid');

            ownerGrid.innerHTML = ''; leaderGrid.innerHTML = ''; memberGrid.innerHTML = '';

            members.forEach(m => {
                const cardHTML = `
                    <div class="member-card">
                        <img src="${m.img || 'https://via.placeholder.com/150'}" class="avatar">
                        <div><strong>${m.name}</strong></div>
                        <div style="font-size:0.85rem; color:#aaa;">${m.alias || '-'}</div>
                    </div>
                `;
                if (m.role === 'owner') ownerGrid.innerHTML += cardHTML;
                else if (m.role === 'leader') leaderGrid.innerHTML += cardHTML;
                else memberGrid.innerHTML += cardHTML;
            });
        }

        function saveMemberRealtime(e) {
            e.preventDefault();
            const name = document.getElementById('m-name').value;
            const alias = document.getElementById('m-alias').value;
            const role = document.getElementById('m-role').value;
            const img = document.getElementById('m-img').value;

            // ส่งข้อมูลขึ้น Realtime Database
            const newMemberRef = db.ref('gangMembers').push();
            newMemberRef.set({ name, alias, role, img }, (error) => {
                if (!error) {
                    alert("เพิ่มสมาชิกสำเร็จ! ทุกเครื่องจะเห็นข้อมูลนี้ทันที");
                    closeModal('adminModal');
                }
            });
        }

        function handleLogin() {
            if (document.getElementById('adminPassword').value === "5720") {
                isAdminLoggedIn = true;
                closeModal('loginModal');
                openModal('adminModal');
            } else {
                alert("รหัสผ่านไม่ถูกต้อง");
            }
        }

        function openLoginModal() { isAdminLoggedIn ? openModal('adminModal') : openModal('loginModal'); }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
