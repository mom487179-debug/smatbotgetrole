<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GANG ROSTER - MANAGEMENT</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-gold: #dfa751;
            --gold-shine: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --bg-dark: #0a0a0c; 
            --card-bg: rgba(18, 18, 24, 0.75);
            --card-border: rgba(223, 167, 81, 0.3);
            --text-light: #f1f1f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, rgba(223, 167, 81, 0.1) 0%, transparent 70%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            padding-bottom: 50px;
            transition: background-image 0.5s ease;
        }

        /* Header & Navbar */
        header {
            background: rgba(10, 10, 12, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .gang-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .gang-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-gold);
            box-shadow: 0 0 10px rgba(223, 167, 81, 0.5);
        }

        .gang-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: var(--gold-shine);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-music-toggle, .btn-admin, .btn-logout {
            background: rgba(223, 167, 81, 0.1);
            color: var(--primary-gold);
            border: 1px solid var(--primary-gold);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-music-toggle:hover, .btn-admin:hover {
            background: var(--primary-gold);
            color: #000;
            box-shadow: 0 0 15px rgba(223, 167, 81, 0.6);
        }

        .btn-logout {
            border-color: #ff4d4d;
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.1);
            display: none; /* ซ่อนไว้ก่อนเข้าสู่ระบบ */
        }

        .btn-logout:hover {
            background: #ff4d4d;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.6);
        }

        /* Update Status Bar */
        .status-bar {
            text-align: center;
            margin: 15px 0 -10px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .status-bar i {
            color: var(--primary-gold);
            margin-right: 5px;
        }

        /* Container & Grids */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .controls {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 500px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 25px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 10px rgba(223, 167, 81, 0.4);
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-gold);
        }

        .section-title {
            font-size: 1.5rem;
            margin: 40px 0 20px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--card-border);
            padding-bottom: 8px;
            color: var(--primary-gold);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        /* Cards */
        .member-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .member-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(223, 167, 81, 0.2);
        }

        .role-badge {
            position: absolute;
            top: 15px; right: 15px;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-owner { background: rgba(255, 62, 62, 0.2); color: #ff5555; border: 1px solid #ff5555; }
        .badge-leader { background: rgba(62, 139, 255, 0.2); color: #5599ff; border: 1px solid #5599ff; }
        .badge-member { background: rgba(223, 167, 81, 0.2); color: var(--primary-gold); border: 1px solid var(--primary-gold); }

        .avatar {
            width: 100px; height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin: 10px auto 15px;
            border: 3px solid rgba(255, 255, 255, 0.1);
        }

        .member-name { font-size: 1.2rem; font-weight: 600; margin-bottom: 5px; }
        .member-alias { font-size: 0.85rem; color: #aaa; margin-bottom: 15px; }

        .member-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-sm {
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            cursor: pointer;
            border: none;
        }
        .btn-edit { background: #ffb703; color: #000; }
        .btn-delete { background: #e63946; color: #fff; }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #15151c;
            border: 1px solid var(--primary-gold);
            width: 90%;
            max-width: 500px;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(223, 167, 81, 0.3);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.5rem;
            color: #aaa;
            cursor: pointer;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--primary-gold); font-size: 0.9rem; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px;
            background: #0a0a0c; border: 1px solid #333;
            border-radius: 8px; color: #fff; outline: none;
        }

        .btn-submit {
            width: 100%; padding: 12px;
            background: var(--gold-shine);
            border: none; color: #000;
            font-weight: bold; border-radius: 8px;
            cursor: pointer; margin-top: 10px;
        }

        .admin-panel-tabs {
            display: flex; gap: 10px;
            margin-bottom: 20px; border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none; border: none;
            color: #aaa; padding: 8px 15px;
            cursor: pointer; font-weight: 600;
        }

        .tab-btn.active {
            color: var(--primary-gold);
            border-bottom: 2px solid var(--primary-gold);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        #music-player-container {
            position: absolute; width: 1px; height: 1px;
            overflow: hidden; left: -9999px;
        }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <header>
        <div class="gang-brand">
            <img id="display-logo" class="gang-logo" src="https://via.placeholder.com/150/000000/dfa751?text=GANG" alt="Gang Logo">
            <h1 id="display-name" class="gang-title">THE ROYAL GANG</h1>
        </div>
        <div class="header-controls">
            <button class="btn-music-toggle" id="music-toggle-btn" onclick="toggleMusic()">
                <i class="fa-solid fa-music"></i> <span id="music-btn-text">เล่นเพลง</span>
            </button>
            <button class="btn-admin" id="admin-main-btn" onclick="openLoginModal()">
                <i class="fa-solid fa-lock"></i> <span id="admin-btn-text">ADMIN MENU</span>
            </button>
            <!-- ปุ่มออกจากระบบ -->
            <button class="btn-logout" id="admin-logout-btn" onclick="handleLogout()">
                <i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
            </button>
        </div>
    </header>

    <!-- Status Bar บันทึกเวลาอัปเดตล่าสุด -->
    <div class="status-bar">
        <i class="fa-solid fa-clock-rotate-left"></i> อัปเดตล่าสุดเมื่อ: <span id="last-updated-time">กำลังโหลด...</span>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="controls">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" onkeyup="filterMembers()" placeholder="ค้นหาชื่อสมาชิก หรือ ฉายาในเกม...">
            </div>
        </div>

        <div class="section-title"><i class="fa-solid fa-crown"></i> GANG OWNER</div>
        <div class="grid-container" id="owner-grid"></div>

        <div class="section-title"><i class="fa-solid fa-shield-halved"></i> GANG LEADER</div>
        <div class="grid-container" id="leader-grid"></div>

        <div class="section-title"><i class="fa-solid fa-users"></i> GANG MEMBER</div>
        <div class="grid-container" id="member-grid"></div>
    </div>

    <!-- LOGIN MODAL -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('loginModal')">&times;</span>
            <h2 style="color: var(--primary-gold); text-align: center; margin-bottom: 20px;">
                <i class="fa-solid fa-shield-cat"></i> เข้าสู่ระบบ ADMIN
            </h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>รหัสผ่าน (Default: 5720)</label>
                    <input type="password" id="adminPassword" placeholder="กรอกรหัสผ่านเพื่อจัดการเว็บ..." required>
                </div>
                <button type="submit" class="btn-submit">LOGIN</button>
            </form>
        </div>
    </div>

    <!-- ADMIN PANEL MODAL -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('adminModal')">&times;</span>
            
            <div class="admin-panel-tabs">
                <button class="tab-btn active" onclick="switchTab('add-tab', event)">เพิ่มสมาชิก</button>
                <button class="tab-btn" onclick="switchTab('style-tab', event)">ตกแต่งเว็บไซต์</button>
            </div>

            <!-- Tab 1: เพิ่ม/แก้ไขสมาชิก -->
            <div id="add-tab" class="tab-content active">
                <h3 id="form-title" style="color: #fff; margin-bottom: 15px;">เพิ่มรายชื่อใหม่</h3>
                <form id="memberForm" onsubmit="saveMember(event)">
                    <input type="hidden" id="edit-index" value="-1">
                    <div class="form-group">
                        <label>ชื่อสมาชิก / Nickname</label>
                        <input type="text" id="m-name" placeholder="เช่น Alex" required>
                    </div>
                    <div class="form-group">
                        <label>ฉายา / ตำแหน่งย่อย</label>
                        <input type="text" id="m-alias" placeholder="เช่น สายบวกหลัก / หมอประจำแก๊ง">
                    </div>
                    <div class="form-group">
                        <label>ระดับ / ตำแหน่งหลัก</label>
                        <select id="m-role">
                            <option value="owner">Owner (หัวหน้าใหญ่)</option>
                            <option value="leader">Leader (รองหัวหน้า/สภา)</option>
                            <option value="member" selected>Member (สมาชิก)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>URL รูปภาพโปรไฟล์</label>
                        <input type="url" id="m-img" placeholder="https://example.com/image.jpg">
                    </div>
                    <button type="submit" class="btn-submit" id="btn-save-member">บันทึกข้อมูล</button>
                </form>
            </div>

            <!-- Tab 2: ตกแต่งเว็บไซต์ -->
            <div id="style-tab" class="tab-content">
                <h3 style="color: #fff; margin-bottom: 15px;">ตั้งค่ารูปร่างหน้าตาเว็บ</h3>
                <form onsubmit="saveSettings(event)">
                    <div class="form-group">
                        <label>ชื่อแก๊ง (Gang Name)</label>
                        <input type="text" id="set-gang-name">
                    </div>
                    <div class="form-group">
                        <label>URL โลโก้แก๊ง</label>
                        <input type="url" id="set-gang-logo">
                    </div>
                    <div class="form-group">
                        <label>URL ภาพพื้นหลังเว็บไซต์</label>
                        <input type="url" id="set-bg-url" placeholder="https://site.com/bg.jpg">
                    </div>
                    <div class="form-group">
                        <label><i class="fa-brands fa-youtube" style="color: #ff0000;"></i> ลิงก์เพลง YouTube</label>
                        <input type="url" id="set-yt-url" placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
                    </div>
                    <button type="submit" class="btn-submit">อัปเดตการตกแต่ง</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Hidden Player -->
    <div id="music-player-container">
        <div id="youtube-player"></div>
    </div>

    <!-- Scripts -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- GLOBAL VARIABLES ---
        const DEFAULT_PASS = "5720";
        let isAdminLoggedIn = false;
        let ytPlayer = null;
        let isMusicPlaying = false;

        let gangSettings = {
            name: "THE ROYAL GANG",
            logo: "https://via.placeholder.com/150/000000/dfa751?text=GANG",
            bgUrl: "",
            ytUrl: "",
            lastUpdated: "-"
        };

        let members = [];

        // --- REALTIME LISTENERS ---
        // 1. ดึงข้อมูลการตกแต่ง + เวลาอัปเดต
        db.ref('gangSettings').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const oldYtUrl = gangSettings.ytUrl;
                gangSettings = data;
                applySettings();

                const videoId = extractYouTubeID(gangSettings.ytUrl);
                if (ytPlayer && videoId && gangSettings.ytUrl !== oldYtUrl) {
                    ytPlayer.loadVideoById(videoId);
                }
            } else {
                gangSettings.lastUpdated = new Date().toLocaleString('th-TH');
                db.ref('gangSettings').set(gangSettings);
            }
        });

        // 2. ดึงข้อมูลรายชื่อสมาชิก
        db.ref('gangMembers').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                members = Array.isArray(data) ? data : Object.values(data);
            } else {
                members = [
                    { name: "Vito Corleone", alias: "Godfather", role: "owner", img: "https://i.pravatar.cc/150?img=11" },
                    { name: "Sonny Corleone", alias: "Underboss", role: "leader", img: "https://i.pravatar.cc/150?img=12" }
                ];
                db.ref('gangMembers').set(members);
            }
            renderMembers();
        });

        // --- HELPER: UPDATE TIMESTAMP ---
        function updateTimestamp() {
            const now = new Date();
            const formattedTime = now.toLocaleString('th-TH', { 
                year: 'numeric', month: 'short', day: 'numeric', 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            });
            
            gangSettings.lastUpdated = formattedTime;
            db.ref('gangSettings/lastUpdated').set(formattedTime);
        }

        // --- YOUTUBE LOGIC ---
        function extractYouTubeID(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function onYouTubeIframeAPIReady() {
            const videoId = extractYouTubeID(gangSettings.ytUrl);
            ytPlayer = new YT.Player('youtube-player', {
                height: '0', width: '0',
                videoId: videoId || '',
                playerVars: { 'autoplay': 1, 'controls': 0, 'loop': 1, 'playlist': videoId || '' },
                events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerReady(event) {
            if (gangSettings.ytUrl) event.target.playVideo();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isMusicPlaying = true;
                document.getElementById('music-btn-text').innerText = "ปิดเพลง";
                document.getElementById('music-toggle-btn').style.background = "var(--primary-gold)";
                document.getElementById('music-toggle-btn').style.color = "#000";
            } else {
                isMusicPlaying = false;
                document.getElementById('music-btn-text').innerText = "เล่นเพลง";
                document.getElementById('music-toggle-btn').style.background = "rgba(223, 167, 81, 0.1)";
                document.getElementById('music-toggle-btn').style.color = "var(--primary-gold)";
            }
        }

        function toggleMusic() {
            if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') return;
            if (isMusicPlaying) ytPlayer.pauseVideo();
            else ytPlayer.playVideo();
        }

        // --- APPLY & RENDER ---
        function applySettings() {
            document.getElementById('display-name').innerText = gangSettings.name || "THE ROYAL GANG";
            document.getElementById('display-logo').src = gangSettings.logo || "https://via.placeholder.com/150/000000/dfa751?text=GANG";
            document.getElementById('last-updated-time').innerText = gangSettings.lastUpdated || "ไม่มีข้อมูล";

            if (gangSettings.bgUrl) {
                document.body.style.backgroundImage = `linear-gradient(rgba(10, 10, 12, 0.75), rgba(10, 10, 12, 0.85)), url('${gangSettings.bgUrl}')`;
            } else {
                document.body.style.backgroundImage = "radial-gradient(circle at center, rgba(223, 167, 81, 0.1) 0%, transparent 70%)";
            }

            document.getElementById('set-gang-name').value = gangSettings.name || "";
            document.getElementById('set-gang-logo').value = gangSettings.logo || "";
            document.getElementById('set-bg-url').value = gangSettings.bgUrl || "";
            document.getElementById('set-yt-url').value = gangSettings.ytUrl || "";
        }

        function renderMembers() {
            const ownerGrid = document.getElementById('owner-grid');
            const leaderGrid = document.getElementById('leader-grid');
            const memberGrid = document.getElementById('member-grid');

            ownerGrid.innerHTML = '';
            leaderGrid.innerHTML = '';
            memberGrid.innerHTML = '';

            members.forEach((m, index) => {
                const defaultImg = `https://via.placeholder.com/150/111/fff?text=${m.name ? m.name.charAt(0) : 'G'}`;
                const imgSrc = m.img ? m.img : defaultImg;
                
                const cardHTML = `
                    <div class="member-card ${m.role}">
                        <span class="role-badge badge-${m.role}">${m.role}</span>
                        <img src="${imgSrc}" class="avatar" onerror="this.src='${defaultImg}'" alt="${m.name}">
                        <div class="member-name">${m.name}</div>
                        <div class="member-alias">${m.alias || '-'}</div>
                        ${isAdminLoggedIn ? `
                            <div class="member-actions">
                                <button class="btn-sm btn-edit" onclick="editMember(${index})"><i class="fa-solid fa-pen"></i> แก้ไข</button>
                                <button class="btn-sm btn-delete" onclick="deleteMember(${index})"><i class="fa-solid fa-trash"></i> ลบ</button>
                            </div>
                        ` : ''}
                    </div>
                `;

                if (m.role === 'owner') ownerGrid.innerHTML += cardHTML;
                else if (m.role === 'leader') leaderGrid.innerHTML += cardHTML;
                else memberGrid.innerHTML += cardHTML;
            });
        }

        function filterMembers() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.member-card').forEach(card => {
                const name = card.querySelector('.member-name').innerText.toLowerCase();
                const alias = card.querySelector('.member-alias').innerText.toLowerCase();
                card.style.display = (name.includes(query) || alias.includes(query)) ? "block" : "none";
            });
        }

        // --- AUTHENTICATION & LOGOUT ---
        function openLoginModal() {
            if (isAdminLoggedIn) openModal('adminModal');
            else openModal('loginModal');
        }

        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('adminPassword').value;
            if (pass === DEFAULT_PASS) {
                isAdminLoggedIn = true;
                closeModal('loginModal');
                document.getElementById('adminPassword').value = '';
                
                // ปรับ UI สถานะ แอดมิน
                document.getElementById('admin-btn-text').innerText = "ADMIN PANEL";
                document.getElementById('admin-logout-btn').style.display = "flex";
                
                renderMembers();
                openModal('adminModal');
            } else {
                alert("รหัสผ่านไม่ถูกต้อง!");
            }
        }

        function handleLogout() {
            if (confirm("คุณต้องการออกจากระบบ Admin หรือไม่?")) {
                isAdminLoggedIn = false;
                document.getElementById('admin-btn-text').innerText = "ADMIN MENU";
                document.getElementById('admin-logout-btn').style.display = "none";
                closeModal('adminModal');
                renderMembers(); // ซ่อนปุ่ม แก้ไข/ลบ
                alert("ออกจากระบบเรียบร้อยแล้ว");
            }
        }

        // --- SAVE DATA TO FIREBASE ---
        function saveMember(e) {
            e.preventDefault();
            const index = document.getElementById('edit-index').value;
            const name = document.getElementById('m-name').value;
            const alias = document.getElementById('m-alias').value;
            const role = document.getElementById('m-role').value;
            const img = document.getElementById('m-img').value;

            const memberData = { name, alias, role, img };

            if (index === "-1") {
                members.push(memberData);
            } else {
                members[index] = memberData;
                document.getElementById('edit-index').value = "-1";
                document.getElementById('form-title').innerText = "เพิ่มรายชื่อใหม่";
                document.getElementById('btn-save-member').innerText = "บันทึกข้อมูล";
            }

            db.ref('gangMembers').set(members).then(() => {
                updateTimestamp(); // บันทึกเวลาอัปเดต
                document.getElementById('memberForm').reset();
                alert("บันทึกข้อมูลสำเร็จ!");
            });
        }

        function editMember(index) {
            const m = members[index];
            document.getElementById('edit-index').value = index;
            document.getElementById('m-name').value = m.name;
            document.getElementById('m-alias').value = m.alias;
            document.getElementById('m-role').value = m.role;
            document.getElementById('m-img').value = m.img;

            document.getElementById('form-title').innerText = "แก้ไขข้อมูลสมาชิก";
            document.getElementById('btn-save-member').innerText = "อัปเดตสมาชิก";
            switchTab('add-tab');
        }

        function deleteMember(index) {
            if (confirm(`คุณต้องการลบ "${members[index].name}" ออกจากแก๊งหรือไม่?`)) {
                members.splice(index, 1);
                db.ref('gangMembers').set(members).then(() => {
                    updateTimestamp(); // บันทึกเวลาอัปเดต
                });
            }
        }

        function saveSettings(e) {
            e.preventDefault();
            gangSettings.name = document.getElementById('set-gang-name').value;
            gangSettings.logo = document.getElementById('set-gang-logo').value;
            gangSettings.bgUrl = document.getElementById('set-bg-url').value;
            gangSettings.ytUrl = document.getElementById('set-yt-url').value;

            db.ref('gangSettings').set(gangSettings).then(() => {
                updateTimestamp(); // บันทึกเวลาอัปเดต
                alert("อัปเดตการตกแต่งเว็บสำเร็จ!");
            });
        }

        // --- MODAL & TAB HELPERS ---
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function switchTab(tabId, evt) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            if (evt) {
                evt.currentTarget.classList.add('active');
            } else {
                document.querySelector(`.tab-btn[onclick*="${tabId}"]`).classList.add('active');
            }
        }
    </script>
</body>
</html>
